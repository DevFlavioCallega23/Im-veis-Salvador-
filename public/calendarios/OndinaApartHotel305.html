<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Studio Moderno em Salvador - Disponibilidade</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

  <!-- CSS global -->
  <link rel="stylesheet" href="../style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- Topo -->
  <div class="topo">

    <a href="../index.html" class="home-btn">
      <i class="fa-solid fa-house"></i> Imóveis em Salvador
    </a>

    <h1>Studio Moderno em Salvador</h1>

  </div>

  <!-- Galeria estilo Airbnb -->
  <div class="galeria-airbnb">

    <!-- Foto principal -->
    <div class="foto-principal">

      <img
        src="https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/9c9a86c5-ef24-48d8-bf1d-7a5a8d7dcb9c.jpeg?im_w=1200"
        alt="Studio Salvador"
        data-categoria="Sala"
      >

    </div>

    <!-- Fotos laterais -->
    <div class="fotos-laterais">

      <img
        src="https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/f0b55a6b-8c40-4f03-86ec-6d3df9d1d64c.jpeg?im_w=720"
        data-categoria="Sala"
      >

      <img
        src="https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/5a71d7a7-5648-4d92-a4e8-06cbab76859e.jpeg?im_w=720"
        data-categoria="Quarto"
      >

      <img
        src="https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/7e4cb112-6378-4c7b-b8f6-72e2b7d4dc66.jpeg?im_w=720"
        data-categoria="Cozinha"
      >

      <div class="foto-com-overlay" data-categoria="Sala">

        <img
          src="https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/df51d4f4-f54d-4e84-a8c2-5fd38bcf4f1f.jpeg?im_w=720"
        >

        <div class="overlay-text">
          Mostrar mais fotos
        </div>

      </div>

    </div>

  </div>

  <!-- Modal da Galeria -->
  <div id="modal" class="modal">

    <span class="fechar">&times;</span>

    <div class="modal-conteudo">
      <div id="imagens-categoria"></div>
    </div>

  </div>

  <!-- Calendário -->
  <div id="calendar"></div>

  <!-- Botões -->
  <button class="reserva-btn">
    Reservar imóvel
  </button>

  <a href="../index.html" class="reserva-btn voltar-btn">
    ← Voltar para Home
  </a>

  <!-- Localização -->
  <div id="MapsContato">

    <div class="map-container">

      <h2 style="text-align:center;">
        📍 Localização
      </h2>

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31100.32444646962!2d-38.530392!3d-13.001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x716043bca4d85dd%3A0x7b9f3ef2a1fd42f0!2sSalvador%20-%20BA!5e0!3m2!1spt-BR!2sbr!4v1765000000000!5m2!1spt-BR!2sbr"
        width="100%"
        height="300"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>

    </div>

  </div>

  <!-- Rodapé -->
  <footer>
    &copy; 2026 Studio Moderno Salvador – Bahia
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Scripts padronizados -->
  <script src="../js/calendar.js"></script>
  <script src="../js/galeria.js"></script>
  <script src="../js/reserva.js"></script>

  <script>

    /* 🔹 Calendário */
    criarCalendario({
      elementId: 'calendar',
      endpoint: '/disponibilidade/studioModernoSalvador'
    });

    /* 🔹 Galeria */
    iniciarGaleria({

      Sala: [

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/9c9a86c5-ef24-48d8-bf1d-7a5a8d7dcb9c.jpeg?im_w=1200",

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/f0b55a6b-8c40-4f03-86ec-6d3df9d1d64c.jpeg?im_w=1200",

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/5a71d7a7-5648-4d92-a4e8-06cbab76859e.jpeg?im_w=1200"

      ],

      Quarto: [

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/7e4cb112-6378-4c7b-b8f6-72e2b7d4dc66.jpeg?im_w=1200",

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/df51d4f4-f54d-4e84-a8c2-5fd38bcf4f1f.jpeg?im_w=1200"

      ],

      Cozinha: [

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/2f9d1c59-c80e-4d34-95a0-9f8658eac429.jpeg?im_w=1200",

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/9d6e9270-c5ab-4a61-b1dd-8d51cb07cdbc.jpeg?im_w=1200"

      ],

      Banheiro: [

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/5d95fd39-5938-4b88-9387-cc20ef5bb6e1.jpeg?im_w=1200"

      ],

      Vista: [

        "https://a0.muscache.com/im/pictures/miso/Hosting-1661744394111052827/original/6a34bb1d-82f5-49f4-9d4f-66e36c35cdb9.jpeg?im_w=1200"

      ]

    });

    /* 🔹 Reserva */
    configurarReserva({

      telefone: '5571993019981',

      mensagem: 'Olá! Tenho interesse no Studio Moderno em Salvador.'

    });

<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">

  <title>
    Studio Moderno em Salvador - Disponibilidade

  <!-- FullCalendar -->
  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
    rel="stylesheet"
  >

  <!-- CSS global -->
  <link rel="stylesheet" href="../style.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

<body>

  <!-- Topo -->
  <div class="topo">

    <a href="../index.html" class="home-btn">

    <h1>
      Studio Moderno em Salvador
    </h1>

  </div>

  <!-- ========================= -->
  <!-- GALERIA -->
  <!-- ========================= -->

  <div class="galeria-airbnb">

    <!-- FOTO PRINCIPAL -->
    <div class="foto-principal">

      <img
        src="https://a0.muscache.com/im/pictures/10a86fe6-04af-47fb-991d-edc6e40cb562.jpg?im_w=720"
        alt="Studio Salvador"
        data-categoria="Sala"
      >

    </div>

    <!-- FOTOS LATERAIS -->
    <div class="fotos-laterais">

      <img
        src="https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/3611ba6b-83f1-476b-a0dc-884c7a67779b.jpeg?im_w=720"
        data-categoria="Quarto"
      >

      <img
        src="https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/e87f2139-c567-4455-a1c0-8b7b6fa1f4d2.jpeg?im_w=720"
        data-categoria="Sala"

        src="https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/9ddceefb-8eda-4f09-9d47-8754e1916661.jpeg?im_w=720"
        data-categoria="Cozinha"
      >

      <!-- Overlay -->
      <div
        class="foto-com-overlay"
        data-categoria="Sala"
      >

        <img
          src="https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/e6b19adf-3b27-401c-8c27-9bfbd2bd0681.jpeg?im_w=720"
        >

        <div class="overlay-text">
          Mostrar mais fotos
        </div>

      </div>

    </div>

  </div>

  <!-- ========================= -->
  <!-- MODAL -->
  <!-- ========================= -->

  <div id="modal" class="modal">

    <span class="fechar">
      &times;
    </span>

    <div class="modal-conteudo">
      <div id="imagens-categoria"></div>
    </div>

  </div>

  <!-- ========================= -->
  <!-- CALENDÁRIO -->
  <!-- ========================= -->

  <div id="calendar"></div>

  <!-- ========================= -->
  <!-- BOTÕES -->
  <!-- ========================= -->

  <button class="reserva-btn">
    Reservar imóvel
  </button>

  <a
    href="../index.html"
    class="reserva-btn voltar-btn"
  >
    ← Voltar para Home
  </a>

  <!-- ========================= -->
  <!-- MAPA -->
  <!-- ========================= -->

  <div id="MapsContato">

    <div class="map-container">

      <h2 style="text-align:center;">
        📍 Localização
      </h2>

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31100.32444646962!2d-38.530392!3d-13.001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x716043bca4d85dd%3A0x7b9f3ef2a1fd42f0!2sSalvador%20-%20BA!5e0!3m2!1spt-BR!2sbr!4v1765000000000!5m2!1spt-BR!2sbr"

        height="300"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>

    </div>

  </div>

  <!-- RODAPÉ -->
  <!-- ========================= -->

  <footer>
    &copy; 2026 Studio Moderno Salvador – Bahia
  </footer>

  <!-- ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Scripts padronizados -->
  <script src="../js/calendar.js"></script>
  <script src="../js/galeria.js"></script>
  <script src="../js/reserva.js"></script>

  <script>

    /* ========================= */
    /* CALENDÁRIO */
    /* ========================= */

    criarCalendario({

      elementId: 'calendar',

      endpoint: '/disponibilidade/studioModernoSalvador'

    /* ========================= */

    /* ========================= */

      Sala: [

        "https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/d66ad49d-bd80-4b01-a046-30c07821ffc7.jpeg?im_w=720",
        "https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/1325aa1b-fd5e-4b0d-92fd-6a3df8e07f29.jpeg?im_w=720"

      ],

      Quarto: [

        "https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/7abd651e-d434-4ccb-ae70-82eb369be093.jpeg?im_w=720",
        "https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/51ebb16c-de4f-4f16-9e19-7f222fb09b43.jpeg?im_w=720",
        "https://a0.muscache.com/im/pictures/hosting/Hosting-1661744394111052827/original/3611ba6b-83f1-476b-a0dc-884c7a67779b.jpeg?im_w=720"

    /* ========================= */

    configurarReserva({

      telefone: '5571993019981',

      mensagem: 'Olá! Tenho interesse no Studio Moderno em Salvador.'

    });

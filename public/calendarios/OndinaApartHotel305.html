<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">

  <title>
    Studio Moderno em Salvador - Disponibilidade
  </title>

  <!-- FullCalendar -->
  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
    rel="stylesheet"
  >

  <!-- CSS global -->
  <link rel="stylesheet" href="../style.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body>

  <!-- Topo -->
  <div class="topo">

    <a href="../index.html" class="home-btn">
      <i class="fa-solid fa-house"></i>
      Imóveis em Salvador
    </a>

    <h1>
      Studio Moderno em Salvador
    </h1>

  </div>

  <!-- ========================= -->
  <!-- GALERIA -->
  <!-- ========================= -->

  <div class="galeria-airbnb">

    <!-- FOTO PRINCIPAL -->
    <div class="foto-principal">

      <img
        src="https://a0.muscache.com/im/pictures/10a86fe6-04af-47fb-991d-edc6e40cb562.jpg?im_w=720"
        alt="Studio Salvador"
        data-categoria="Sala"
      >

    </div>

    <!-- FOTOS LATERAIS -->
    <div class="fotos-laterais">

      <img
        src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=720"
        data-categoria="Sala"
      >

      <img
        src="https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?q=80&w=720"
        data-categoria="Quarto"
      >

      <img
        src="https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=720"
        data-categoria="Cozinha"
      >

      <!-- Overlay -->
      <div
        class="foto-com-overlay"
        data-categoria="Sala"
      >

        <img
          src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=720"
        >

        <div class="overlay-text">
          Mostrar mais fotos
        </div>

      </div>

    </div>

  </div>

  <!-- ========================= -->
  <!-- MODAL -->
  <!-- ========================= -->

  <div id="modal" class="modal">

    <span class="fechar">
      &times;
    </span>

    <div class="modal-conteudo">
      <div id="imagens-categoria"></div>
    </div>

  </div>

  <!-- ========================= -->
  <!-- CALENDÁRIO -->
  <!-- ========================= -->

  <div id="calendar"></div>

  <!-- ========================= -->
  <!-- BOTÕES -->
  <!-- ========================= -->

  <button class="reserva-btn">
    Reservar imóvel
  </button>

  <a
    href="../index.html"
    class="reserva-btn voltar-btn"
  >
    ← Voltar para Home
  </a>

  <!-- ========================= -->
  <!-- MAPA -->
  <!-- ========================= -->

  <div id="MapsContato">

    <div class="map-container">

      <h2 style="text-align:center;">
        📍 Localização
      </h2>

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31100.32444646962!2d-38.530392!3d-13.001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x716043bca4d85dd%3A0x7b9f3ef2a1fd42f0!2sSalvador%20-%20BA!5e0!3m2!1spt-BR!2sbr!4v1765000000000!5m2!1spt-BR!2sbr"
        width="100%"
        height="300"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>

    </div>

  </div>

  <!-- ========================= -->
  <!-- RODAPÉ -->
  <!-- ========================= -->

  <footer>
    &copy; 2026 Studio Moderno Salvador – Bahia
  </footer>

  <!-- ========================= -->
  <!-- SCRIPTS -->
  <!-- ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Scripts padronizados -->
  <script src="../js/calendar.js"></script>
  <script src="../js/galeria.js"></script>
  <script src="../js/reserva.js"></script>

  <script>

    /* ========================= */
    /* CALENDÁRIO */
    /* ========================= */

    criarCalendario({

      elementId: 'calendar',

      endpoint: '/disponibilidade/studioModernoSalvador'

    });

    /* ========================= */
    /* GALERIA */
    /* ========================= */

    iniciarGaleria({

      Sala: [

        "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200",

        "https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200",

        "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?q=80&w=1200"

      ],

      Quarto: [

        "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?q=80&w=1200",

        "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200"

      ],

      Cozinha: [

        "https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200",

        "https://images.unsplash.com/photo-1556911220-bff31c812dba?q=80&w=1200"

      ],

      Banheiro: [

        "https://images.unsplash.com/photo-1620626011761-996317b8d101?q=80&w=1200"

      ],

      Vista: [

        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200"

      ]

    });

    /* ========================= */
    /* RESERVA */
    /* ========================= */

    configurarReserva({

      telefone: '5571993019981',

      mensagem: 'Olá! Tenho interesse no Studio Moderno em Salvador.'

    });

  </script>

</body>
</html>

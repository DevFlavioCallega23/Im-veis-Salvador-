<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Histórico de Envios</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      padding: 30px;
    }
    h2 {
      text-align: center;
      color: #007bff;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .status-sucesso {
      color: green;
      font-weight: bold;
    }
    .status-erro {
      color: red;
      font-weight: bold;
    }
    #loading {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>📋 Histórico de Envios</h2>
  <div id="loading">🔄 Carregando dados...</div>
  <table id="tabela">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Número</th>
        <th>Mensagem</th>
        <th>Status</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function carregarHistorico() {
      const loading = document.getElementById("loading");
      loading.textContent = "🔄 Atualizando...";

      try {
        const res = await fetch("/historico");
        const dados = await res.json();
        const tbody = document.querySelector("#tabela tbody");
        tbody.innerHTML = "";

        if (!Array.isArray(dados) || dados.length === 0) {
          loading.textContent = "⚠️ Nenhum registro encontrado.";
          return;
        }

        dados.reverse().forEach(item => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${item.nome || "-"}</td>
            <td>${item.numero}</td>
            <td>${item.mensagem}</td>
            <td class="${item.status === 'sucesso' ? 'status-sucesso' : 'status-erro'}">${item.status}</td>
            <td>${item.data}</td>
          `;

          tbody.appendChild(tr);
        });

        loading.textContent = "";
      } catch (err) {
        loading.textContent = "❌ Erro ao carregar histórico.";
        console.error("Erro ao buscar histórico:", err);
      }
    }

    carregarHistorico();
    setInterval(carregarHistorico, 10000); // Atualiza a cada 10 segundos
  </script>
</body>
</html>
